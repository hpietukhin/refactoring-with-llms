# Project-wide configuration.
[git]
repo_path = "."
worktrees_dir = "experiments/worktrees"
java_only = true
include_untracked = false

[planning]
default_transition_cost = 1.0
planner = "no_priority"
locality = "none"
token_budget = 200000

[smell]
default_detector = "ORGANIC"

[java]
build_tool = "maven"
maven_command = "mvn"
legacy_sdkman_java = "8.0.442-amzn"
jacoco_report = "target/site/jacoco/jacoco.xml"
ck_dir = "java/metrics/ck"

[dataset]
root = "dataset"
manifest = "dataset/manifest.jsonl"

[neo4j]
uri = "http://127.0.0.1:7474"
user = "neo4j"
password = "boil2.eat"
timeout_seconds = 30
startup_timeout_seconds = 120
cypher_path = "/db/data/cypher"
start_script = "dataset/scripts/start_neo4j.sh"
stop_script = "dataset/scripts/stop_neo4j.sh"

[detection]
backend = "organic"
timeout_seconds = 120
organic_dir = "detection/organic-standalone"
elements = ""

[experiments]
root = "experiments"
output_dir = "data/experiments/output"

[langgraph]
model = "mistralai/codestral-2508"
temperature = 0.0
timeout_seconds = 120
max_steps = 5
repair_step_limit = 4
repair_max_attempts = 3

[openrouter]
api_key = "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"

[testing]
root = "testing"
jacoco_report = "target/site/jacoco/jacoco.xml"
min_line_coverage = 0.8

[logging]
level = "INFO"
file = "data/all.log"
